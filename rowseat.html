<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0a0a0f">
<meta http-equiv="Cache-Control" content="no-cache">
<title>1Q 로잉 자리 배치</title>
<script>
/* 자동 캐시 무효화 */
(function(){var V="8";try{fetch("version.json?cb="+Date.now(),{cache:"no-store"}).then(function(r){return r.json();}).then(function(j){if(j&&j.rowseat&&String(j.rowseat)!==V&&location.search.indexOf("v="+j.rowseat)===-1){location.replace(location.pathname+"?v="+j.rowseat);}}).catch(function(){});}catch(e){}})();
</script>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  :root{--bg:#0a0a0f;--panel:#15151f;--line:#26263a;--text:#f5f5f7;--muted:#9a9aab;--accent:#37d67a;--gold:#ffd54a;}
  html,body{height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Segoe UI",Roboto,sans-serif;}
  body{display:flex;flex-direction:column;min-height:100%;padding:env(safe-area-inset-top) 0 0;}
  header{padding:10px 14px 6px;text-align:center;position:relative;}
  .modeBtn{position:absolute;top:8px;right:10px;background:#22303a;border:1px solid var(--line);color:#8fd6ff;border-radius:10px;padding:7px 10px;font-weight:800;font-size:12px;}
  .modeov{align-items:center !important;}
  .modecard{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:26px 22px;width:calc(100% - 44px);max-width:380px;text-align:center;}
  .modecard .mt{font-size:20px;font-weight:900;}
  .modecard .ms{color:var(--muted);font-size:13px;margin:6px 0 18px;}
  .mbtn{display:block;width:100%;border:none;border-radius:14px;padding:15px 16px;margin-top:10px;font-size:17px;font-weight:800;text-align:left;}
  .mbtn span{display:block;font-size:12px;font-weight:600;opacity:.85;margin-top:3px;}
  .mbtn.shoot{background:#2f6f4a;color:#fff;} .mbtn.sim{background:#3a4a6a;color:#cfe3ff;}
  .boathdr{position:absolute;transform:translateX(-50%);display:flex;align-items:center;gap:7px;background:rgba(21,21,31,.92);border:1px solid #33334a;border-radius:15px;padding:3px 10px 3px 4px;white-space:nowrap;cursor:pointer;}
  .boathdr .bn{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;background:#3a4a6a;color:#fff;font-weight:900;font-size:13px;}
  .boathdr .bo{font-weight:800;font-size:15px;color:#6a6a80;}
  .boathdr.has .bo{color:var(--gold);}
  .boathdr:active{transform:translateX(-50%) scale(.96);}
  .stagelabel{position:absolute;font-weight:900;font-size:34px;color:#3a3a4c;letter-spacing:3px;pointer-events:none;}
  .stagelabel.sl-r{right:36px;top:22px;} .stagelabel.sl-l{left:36px;top:648px;}
  .cam{position:absolute;left:910px;top:686px;transform:translateX(-50%);text-align:center;font-size:34px;line-height:1;pointer-events:none;}
  .cam .cl{display:block;font-size:12px;font-weight:800;color:#8fd6ff;margin-top:2px;letter-spacing:1px;}
  .imgov{position:fixed;inset:0;background:#000;z-index:40;display:none;flex-direction:column;}
  .imgov.on{display:flex;}
  .imgov .imgbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px calc(12px + env(safe-area-inset-top));background:#15151f;color:var(--text);font-weight:800;font-size:14px;}
  .imgov .imgbar button{background:#2a2a3c;border:none;color:var(--text);border-radius:9px;padding:9px 13px;font-weight:800;flex:none;}
  .imgov .imgwrap{flex:1;min-height:0;overflow:auto;display:flex;align-items:center;justify-content:center;padding:6px;}
  .imgov img{max-width:100%;height:auto;}
  header h1{font-size:clamp(16px,4.4vw,20px);font-weight:800;}
  header .sub{color:var(--muted);font-size:12px;margin-top:2px;}
  .cnt{color:var(--gold);font-weight:800;}
  .hint{color:#667;font-size:11px;margin-top:2px;}
  .stagewrap{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;padding:6px;display:flex;justify-content:center;align-items:flex-start;}
  #stage{position:relative;width:1820px;height:800px;background:linear-gradient(180deg,#0e0e16,#0a0a0f);border:1px solid var(--line);border-radius:14px;transform-origin:top center;flex:none;}
  .seat{position:absolute;width:60px;height:50px;background:#1b1b28;border:1px solid #33334a;border-radius:9px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;overflow:hidden;transition:.1s;}
  .seat.empty{border-style:dashed;border-color:#3a3a52;background:#141420;}
  .seat.filled{background:#22314a;border-color:#3f6ea8;}
  .seat:active{transform:scale(.94);}
  .seat .num{position:absolute;top:2px;left:4px;font-size:9.5px;font-weight:800;color:var(--gold);line-height:1;}
  .seat .org{font-size:9px;font-weight:800;color:var(--gold);line-height:1.05;margin-top:7px;letter-spacing:.3px;}
  .seat .nm{font-size:10.5px;font-weight:700;line-height:1.05;text-align:center;padding:1px 3px 2px;word-break:break-all;}
  .seat.filled .org + .nm{padding-top:0;}
  .seat.empty .nm{color:#4a4a63;font-weight:600;}
  .mon{position:absolute;left:26px;bottom:20px;width:120px;text-align:center;}
  .mon .box{width:74px;height:52px;border:2px solid #6a6a80;border-radius:6px;margin:0 auto;background:#12121c;display:flex;align-items:center;justify-content:center;font-size:20px;}
  .mon .lb{font-size:12px;color:var(--muted);margin-top:5px;font-weight:700;}
  svg.cables{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;}
  .toolbar{display:flex;gap:8px;padding:10px 12px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:#0d0d15;}
  .toolbar button{flex:1;height:48px;border:none;border-radius:12px;font-weight:800;font-size:14px;}
  #saveBtn{background:var(--accent);color:#0a0a0f;} #zoomBtn{background:#22303a;color:#8fd6ff;} #clrBtn{background:#3a2226;color:#ff9aa5;}
  /* modal */
  .ov{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-end;justify-content:center;z-index:20;}
  .ov.on{display:flex;}
  .sheet{width:100%;max-width:560px;background:var(--panel);border:1px solid var(--line);border-radius:18px 18px 0 0;max-height:86vh;display:flex;flex-direction:column;}
  .sheet .sh{display:flex;align-items:center;gap:10px;padding:14px 16px 8px;}
  .sheet .sh .tt{font-size:17px;font-weight:800;flex:1;}
  .sheet .sh .cls{background:#2a2a3c;border:none;color:var(--text);border-radius:9px;padding:8px 12px;font-weight:800;}
  .free{display:flex;gap:8px;padding:4px 16px 10px;}
  .free input{flex:1;background:#0e0e16;border:1px solid var(--line);color:var(--text);border-radius:10px;padding:11px;font-size:15px;}
  .free button{background:var(--accent);color:#0a0a0f;border:none;border-radius:10px;padding:0 16px;font-weight:800;}
  .srch{padding:0 16px 8px;}
  .srch input{width:100%;background:#0e0e16;border:1px solid var(--line);color:var(--text);border-radius:10px;padding:10px;font-size:14px;}
  .roster{overflow-y:auto;padding:0 12px 12px;}
  .grp{margin-top:8px;}
  .grp .gt{font-size:12px;color:var(--muted);font-weight:800;padding:6px 4px 4px;position:sticky;top:0;background:var(--panel);}
  .chips{display:flex;flex-wrap:wrap;gap:6px;}
  .chip{background:#1c1c28;border:1px solid var(--line);border-radius:9px;padding:9px 11px;font-size:13.5px;font-weight:700;}
  .chip.used{opacity:.5;}
  .chip .at{color:var(--gold);font-size:11px;font-weight:800;margin-left:5px;}
  .clrseat{margin:2px 16px 14px;background:#3a2226;color:#ff9aa5;border:none;border-radius:10px;padding:11px;font-weight:800;font-size:14px;}
</style>
</head>
<body>
  <header>
    <button id="modeBtn" class="modeBtn">용도 ▾</button>
    <h1>1Q 로잉 자리 배치</h1>
    <div class="sub">자리를 눌러 이름을 배정하세요 · <span class="cnt" id="cnt">0/48</span> 배정</div>
    <div class="hint">배 위 번호=그룹(1~8) · 번호 옆을 눌러 소속 입력 · 손가락으로 밀어 보세요</div>
  </header>
  <div class="stagewrap" id="stagewrap">
    <div id="stage">
      <svg class="cables" viewBox="0 0 1820 800" id="cables"></svg>
      <div class="stagelabel sl-r">상수</div>
      <div class="stagelabel sl-l">하수</div>
      <div class="mon"><div class="box">🖥️</div><div class="lb">Data Center</div></div>
      <div class="cam">🎥<span class="cl">CAM</span></div>
    </div>
  </div>
  <div class="toolbar">
    <button id="saveBtn">⬇ 이미지 저장</button>
    <button id="clrBtn">전체 초기화</button>
  </div>

  <div class="ov modeov" id="modeSel">
    <div class="modecard">
      <div class="mt">1Q 로잉 자리 배치</div>
      <div class="ms">용도를 선택하세요</div>
      <button class="mbtn shoot" data-m="촬영">🎬 촬영용<span>확정 출연진 명단 + 직접 입력</span></button>
      <button class="mbtn sim" data-m="시뮬">🧪 시뮬레이션용<span>직접 입력만 (명단 없음)</span></button>
    </div>
  </div>
  <div class="ov" id="ov">
    <div class="sheet">
      <div class="sh"><span class="tt" id="mTitle">자리 배정</span><button class="cls" id="mClose">닫기</button></div>
      <div class="free"><input id="freeInput" type="text" placeholder="이름 직접 입력"><button id="freeSet">지정</button></div>
      <div class="srch"><input id="srch" type="text" placeholder="출연진 검색 (이름/국가)"></div>
      <div class="roster" id="roster"></div>
      <button class="clrseat" id="clrSeat">이 자리 비우기</button>
    </div>
  </div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>
(function(){
  const K="rowseat_v1";
  const $=id=>document.getElementById(id);
  const load=()=>{try{return JSON.parse(localStorage.getItem(K))||{};}catch(e){return {};}};
  const save=o=>{try{localStorage.setItem(K,JSON.stringify(o));}catch(e){}};
  const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

  const ROSTER=[
    ["대한민국",["아모띠(김재홍)","고석현","김민서","안창림","윤현지","정예진"]],
    ["몽골",["어르헝바야르","빌궁","바트수리","척트바타르","다바나산","아나르"]],
    ["일본",["카게우라 고코로","미우라 코타","이토이 요시오","쿠리하라 다카시","나가이 네네","카가미 유카"]],
    ["호주",["에디 윌리엄스","조시 케네디","타이슨 페드로","히스 소프","모건 미첼","재스민 파"]],
    ["인도",["라훌 차우다리","비크람 싱","만 샤르마","로힛 토카스","리투 포갓","가리마 차우다리"]],
    ["우즈베키스탄",["묵슨","아지즈벡","샤크람","마크","미르자에바","니기나"]],
    ["사우디아라비아",["탈랄 알아바시","탈랄 하우사","파이살 쿠르디","살레 알아킬","왈라 알야마니","손도스 알샤리프"]],
    ["뉴질랜드",["스콧 커리","매튜 래그","히코 커티스","마크 제이콥스","밀라 뷰캐넌","메이시 프레이저"]]
  ];

  let mode = localStorage.getItem('rowseat_mode')||'';  // '촬영' | '시뮬'
  const OK="rowseat_orgs_v1";
  let orgs=(function(){try{return JSON.parse(localStorage.getItem(OK))||{};}catch(e){return {};}})(); // {boatIndex0-7:소속}
  function saveOrgs(){try{localStorage.setItem(OK,JSON.stringify(orgs));}catch(e){}}
  let data=(function(){
    const raw=load();
    if(Object.keys(orgs).length===0){ // 구버전(자리별 소속) → 배별 소속으로 이관
      for(let p=0;p<8;p++){const c={};for(let i=1;i<=6;i++){const v=raw[6*p+i];if(v&&typeof v==='object'&&v.o){c[v.o]=(c[v.o]||0)+1;}}let b='',bc=0;for(const k in c){if(c[k]>bc){bc=c[k];b=k;}}if(b)orgs[p]=b;}
      if(Object.keys(orgs).length)saveOrgs();
    }
    const d={}; Object.keys(raw).forEach(k=>{const v=raw[k]; const n=(v&&typeof v==='object')?(v.n||''):v; if(n)d[k]=n;});
    return d;                 // {seatNum:이름}
  })();
  let curSeat=null;
  const stage=$('stage'), cables=$('cables');
  const SW=1820, SH=800, CW=54, CH=44, RY=60, CWD=36;

  // ---- layout: 8 boats(teams) fanned in an arc; each boat = 1 / 2 / 2 / 1 shape ----
  const seats=[];   // {n,x,y}
  const HULLS=[];   // svg path per boat
  const BMETA=[];   // {cx,ty} per boat for team label
  for(let p=0;p<8;p++){
    const t=(p+0.5)/8;
    const cx=160 + t*(SW-320);
    const nx=(cx-SW/2)/(SW/2);
    const cy=300 + nx*nx*170;              // rainbow center per boat
    const ang=nx*18*Math.PI/180;           // fan tilt
    const ca=Math.cos(ang), sa=Math.sin(ang);
    const loc=[[0,-1.5*RY],[-CWD,-0.5*RY],[CWD,-0.5*RY],[-CWD,0.5*RY],[CWD,0.5*RY],[0,1.5*RY]];
    const ord=[6,4,5,2,3,1]; // 위치(뱃머리→꼬리) 순서로 번호 매핑: 꼬리=1 … 뱃머리=6
    loc.forEach((o,i)=>{
      const rx=o[0]*ca-o[1]*sa, ry=o[0]*sa+o[1]*ca;
      seats.push({n:6*p+ord[i], x:cx+rx-CW/2, y:cy+ry-CH/2});
    });
    const hh=1.5*RY+CH/2+22, hw=CWD+CW/2+16;
    const RT=(x,y)=>[cx+(x*ca-y*sa), cy+(x*sa+y*ca)];
    const tp=RT(0,-hh), bt=RT(0,hh), cr=RT(hw,0), cl=RT(-hw,0);
    BMETA.push({cx:cx, ty:tp[1], cy:cy});
    HULLS.push(`M${tp[0].toFixed(1)} ${tp[1].toFixed(1)} Q${cr[0].toFixed(1)} ${cr[1].toFixed(1)} ${bt[0].toFixed(1)} ${bt[1].toFixed(1)} Q${cl[0].toFixed(1)} ${cl[1].toFixed(1)} ${tp[0].toFixed(1)} ${tp[1].toFixed(1)} Z`);
  }
  const seatByN={}; seats.forEach(s=>seatByN[s.n]=s);

  function seatCenter(n){const s=seatByN[n];return {x:s.x+CW/2,y:s.y+CH/2};}
  function drawHulls(){
    let d='';
    const camX=910, camY=680;
    for(let p=0;p<8;p++){ const m=BMETA[p]; d+=`<path d="M${camX} ${camY} L${m.cx.toFixed(1)} ${(m.cy+34).toFixed(1)}" stroke="#2b3548" stroke-width="1.5" stroke-dasharray="5 7" fill="none"/>`; }
    HULLS.forEach(h=>{ d+=`<path d="${h}" fill="#131b2a" stroke="#3c4c68" stroke-width="2.5"/>`; });
    const mon={x:92,y:SH-92};
    d+=`<path d="M${mon.x} ${mon.y} L${seatCenter(1).x} ${seatCenter(1).y}" stroke="#33334a" stroke-width="2" fill="none"/>`;
    cables.innerHTML=d;
  }

  function render(){
    stage.querySelectorAll('.seat,.boathdr').forEach(e=>e.remove());
    seats.forEach(s=>{
      const nm=data[s.n];
      const el=document.createElement('div');
      el.className='seat '+(nm?'filled':'empty');
      el.style.left=s.x+'px'; el.style.top=s.y+'px';
      el.innerHTML='<span class="num">'+s.n+'</span><span class="nm">'+(nm?esc(nm):'')+'</span>';
      el.addEventListener('click',()=>openSeat(s.n));
      stage.appendChild(el);
    });
    for(let p=0;p<8;p++){
      const m=BMETA[p]; const org=orgs[p]||'';
      const h=document.createElement('div');
      h.className='boathdr'+(org?' has':'');
      h.style.left=m.cx+'px'; h.style.top=(m.ty-42)+'px';
      h.innerHTML='<span class="bn">'+(p+1)+'</span><span class="bo">'+(org?esc(org):'＋소속')+'</span>';
      h.addEventListener('click',()=>setBoatOrg(p));
      stage.appendChild(h);
    }
    const filled=Object.values(data).filter(Boolean).length;
    $('cnt').textContent=filled+'/48';
  }
  function setBoatOrg(p){
    const cur=orgs[p]||'';
    const v=prompt((p+1)+'번 배 소속 입력 (예: KOR) · 지우려면 비우고 확인', cur);
    if(v===null)return;
    const t=v.trim(); if(t)orgs[p]=t; else delete orgs[p];
    saveOrgs(); render();
  }
  drawHulls(); render();

  // ---- assign modal ----
  function usedMap(){const m={};Object.entries(data).forEach(([k,v])=>{if(v)m[v]=k;});return m;}
  function openSeat(n){
    curSeat=n; $('mTitle').textContent=n+'번 자리 배정';
    $('freeInput').value=data[n]||''; $('srch').value='';
    const sim=(mode==='시뮬');
    document.querySelector('.srch').style.display=sim?'none':'';
    $('roster').style.display=sim?'none':'';
    if(!sim) renderRoster('');
    $('ov').classList.add('on');
  }
  function renderRoster(q){
    const used=usedMap(); q=(q||'').trim();
    let html='';
    ROSTER.forEach(([country,names])=>{
      const items=names.filter(nm=>!q || nm.includes(q) || country.includes(q));
      if(!items.length)return;
      html+='<div class="grp"><div class="gt">'+country+'</div><div class="chips">';
      items.forEach(nm=>{
        const at=used[nm]; const cls='chip'+(at&&at!=curSeat?' used':'');
        html+='<button class="'+cls+'" data-nm="'+esc(nm)+'">'+esc(nm)+(at?'<span class="at">'+at+'번</span>':'')+'</button>';
      });
      html+='</div></div>';
    });
    $('roster').innerHTML=html;
    $('roster').querySelectorAll('.chip').forEach(b=>b.addEventListener('click',()=>assign(b.dataset.nm)));
  }
  function assign(nm){
    for(const k in data){ if(data[k]===nm && k!=curSeat) delete data[k]; }
    data[curSeat]=nm; save(data); render(); close();
  }
  function close(){$('ov').classList.remove('on');}
  $('freeSet').addEventListener('click',()=>{const nm=$('freeInput').value.trim(); if(nm){assign(nm);} else {delete data[curSeat];save(data);render();close();}});
  $('freeInput').addEventListener('keydown',e=>{if(e.key==='Enter'){$('freeSet').click();}});
  $('srch').addEventListener('input',e=>renderRoster(e.target.value));
  $('clrSeat').addEventListener('click',()=>{delete data[curSeat];save(data);render();close();});
  $('mClose').addEventListener('click',close);
  $('ov').addEventListener('click',e=>{if(e.target===$('ov'))close();});

  // ---- fit to width ----
  function fit(){
    const wrap=$('stagewrap'); const avail=wrap.clientWidth-12;
    const sc=Math.max(0.85, Math.min(1, avail/SW));
    stage.style.transform='scale('+sc+')';
    wrap.style.minHeight=(SH*sc+20)+'px';
    stage.dataset.scale=sc;
  }
  window.addEventListener('resize',fit); fit();

  // ---- PNG export ----
  const isMobile=/iP(hone|ad|od)|Android/i.test(navigator.userAgent);
  function showImgOverlay(url){
    let ov=$('imgov');
    if(!ov){
      ov=document.createElement('div'); ov.id='imgov'; ov.className='imgov';
      ov.innerHTML='<div class="imgbar"><span>이미지를 길게 눌러 "사진에 저장"하세요</span><button id="imgClose">닫기</button></div><div class="imgwrap"><img></div>';
      document.body.appendChild(ov);
      ov.querySelector('#imgClose').addEventListener('click',()=>ov.classList.remove('on'));
    }
    ov.querySelector('img').src=url; ov.classList.add('on');
  }
  $('saveBtn').addEventListener('click',()=>{
    const prev=stage.style.transform; stage.style.transform='scale(1)';
    $('saveBtn').textContent='저장 중...';
    html2canvas(stage,{backgroundColor:'#0a0a0f',scale:isMobile?1.6:2,useCORS:true}).then(cv=>{
      stage.style.transform=prev; $('saveBtn').textContent='⬇ 이미지 저장';
      cv.toBlob(function(blob){
        if(!blob){ showImgOverlay(cv.toDataURL('image/png')); return; }
        const file=new File([blob],'1Q_로잉_자리배치.png',{type:'image/png'});
        // 1) 모바일: 공유 시트(사진 저장)
        if(navigator.canShare && navigator.canShare({files:[file]})){
          navigator.share({files:[file],title:'1Q 로잉 자리 배치'}).catch(()=>{ showImgOverlay(URL.createObjectURL(blob)); });
          return;
        }
        // 2) 데스크톱: 다운로드
        const url=URL.createObjectURL(blob);
        const a=document.createElement('a'); a.href=url; a.download='1Q_로잉_자리배치.png';
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(()=>URL.revokeObjectURL(url),5000);
        if(isMobile) showImgOverlay(url);   // 다운로드 미지원 대비
      },'image/png');
    }).catch(()=>{stage.style.transform=prev;$('saveBtn').textContent='⬇ 이미지 저장';alert('저장 실패 - 화면 캡처를 이용해주세요');});
  });

  $('clrBtn').addEventListener('click',()=>{if(confirm('모든 배정을 초기화할까요?')){data={};save(data);render();}});

  // ---- 모드 선택 (촬영용 / 시뮬용) ----
  function updateModeUI(){ $('modeBtn').textContent = mode==='시뮬' ? '시뮬레이션용 ▾' : (mode==='촬영'?'촬영용 ▾':'용도 ▾'); }
  function setMode(m){ mode=m; localStorage.setItem('rowseat_mode',m); $('modeSel').classList.remove('on'); updateModeUI(); }
  $('modeSel').querySelectorAll('.mbtn').forEach(b=>b.addEventListener('click',()=>setMode(b.dataset.m)));
  $('modeBtn').addEventListener('click',()=>$('modeSel').classList.add('on'));
  updateModeUI();
  if(!mode){ $('modeSel').classList.add('on'); }
})();
</script>
</body>
</html>
