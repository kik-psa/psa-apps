<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0a0a0f">
<meta http-equiv="Cache-Control" content="no-cache">
<title>공유 타이머</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
/* 버전 캐시 무효화 */
(function(){var V="1";try{fetch("version.json?cb="+Date.now(),{cache:"no-store"}).then(function(r){return r.json();}).then(function(j){if(j&&j.sync&&String(j.sync)!==V&&location.search.indexOf("v="+j.sync)===-1){location.replace(location.pathname+"?v="+j.sync);}}).catch(function(){});}catch(e){}})();
</script>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  :root{--bg:#0a0a0f;--panel:#15151f;--line:#26263a;--text:#f5f5f7;--muted:#9aa;--accent:#37d67a;--gold:#ffd54a;--red:#ff5c5c;--blue:#4aa3ff;}
  html,body{height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Segoe UI",Roboto,sans-serif;overflow:hidden;}
  body{display:flex;flex-direction:column;height:100%;}
  /* top bar */
  #top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 16px;border-bottom:1px solid var(--line);background:#0d0d15;}
  #top .left{display:flex;align-items:center;gap:10px;min-width:0;}
  .conn{font-size:11px;padding:3px 9px;border-radius:10px;font-weight:800;white-space:nowrap;}
  .conn.ok{background:#173a26;color:#7ee6a6;} .conn.no{background:#3a1a1a;color:#ff9a9a;}
  #modeTag{font-size:clamp(13px,2.4vw,17px);font-weight:900;color:var(--gold);white-space:nowrap;}
  #hostTag{font-size:12px;color:var(--muted);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  #hostTag b{color:var(--accent);}
  /* clock */
  #clockzone{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative;}
  #clock{font-weight:900;font-variant-numeric:tabular-nums;letter-spacing:-.03em;line-height:.82;white-space:nowrap;color:#fff;font-size:120px;}
  #clock.warn{color:var(--red);}
  #cdec{color:var(--gold);font-size:.3em;}
  /* A/B counters (mode C) */
  #counters{display:none;position:absolute;left:0;right:0;bottom:10px;justify-content:space-between;padding:0 24px;pointer-events:none;}
  #counters.on{display:flex;}
  .cnt{text-align:center;}
  .cnt .lab{font-size:clamp(16px,3vw,30px);font-weight:900;}
  .cnt .num{font-size:clamp(40px,9vw,120px);font-weight:900;font-variant-numeric:tabular-nums;line-height:1;}
  .cnt.a .lab{color:var(--blue);} .cnt.a .num{color:var(--blue);}
  .cnt.b .lab{color:var(--accent);} .cnt.b .num{color:var(--accent);}
  #turnHint{position:absolute;left:0;right:0;top:8px;text-align:center;font-size:clamp(12px,2vw,18px);color:var(--muted);font-weight:800;display:none;}
  #turnHint.on{display:block;}
  /* toolbar */
  #bar{display:flex;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:#0d0d15;flex-wrap:wrap;}
  #bar button{flex:1;min-width:84px;height:52px;border:none;border-radius:12px;font-weight:800;font-size:15px;color:#fff;cursor:pointer;}
  #startBtn{background:var(--accent);color:#06210f;} #startBtn.paused{background:#e6b800;color:#2a2000;}
  #resetBtn{background:#3a2226;color:#ff9aa5;}
  #modeBtn{background:#22303a;color:#8fd6ff;} #setBtn{background:#2a2a3c;} #fsBtn{background:#22303a;color:#8fd6ff;}
  #claimBar{display:none;padding:12px;border-top:1px solid var(--line);background:#0d0d15;}
  #claimBar.on{display:block;}
  #claimBtn{width:100%;height:54px;border:none;border-radius:12px;background:var(--accent);color:#06210f;font-weight:900;font-size:16px;}
  #viewNote{text-align:center;color:var(--muted);font-size:12px;padding:6px;}
  /* overlays */
  .ov{position:fixed;inset:0;background:rgba(0,0,0,.66);display:none;align-items:center;justify-content:center;z-index:30;padding:16px;}
  .ov.on{display:flex;}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:18px;width:100%;max-width:440px;max-height:90vh;display:flex;flex-direction:column;}
  .card .h{display:flex;align-items:center;gap:10px;padding:16px 18px 8px;}
  .card .h .t{font-size:18px;font-weight:900;flex:1;}
  .card .h .x{background:#2a2a3c;border:none;color:#fff;border-radius:9px;padding:8px 12px;font-weight:800;}
  .card .body{padding:8px 18px 6px;overflow:auto;}
  .row{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap;}
  .row label{font-size:13px;color:var(--muted);font-weight:700;min-width:96px;}
  input[type=text],input[type=number]{background:#0e0e16;border:1px solid var(--line);color:var(--text);border-radius:10px;padding:11px;font-size:16px;flex:1;min-width:100px;}
  .seg{display:flex;gap:6px;flex:1;}
  .seg button{flex:1;background:#22232f;border:1px solid var(--line);color:var(--muted);border-radius:10px;padding:12px 6px;font-weight:800;font-size:13px;}
  .seg button.on{background:var(--accent);color:#06210f;border-color:var(--accent);}
  .foot{display:flex;gap:8px;padding:12px 18px 16px;}
  .foot button{flex:1;height:48px;border:none;border-radius:12px;font-weight:800;font-size:15px;}
  .btn-primary{background:var(--accent);color:#06210f;} .btn-ghost{background:#2a2a3c;color:#fff;}
  .hint{color:#778;font-size:11.5px;padding:2px 18px 10px;line-height:1.6;}
</style>
</head>
<body>
  <div id="top">
    <div class="left">
      <span class="conn no" id="conn">연결 중…</span>
      <span id="modeTag">카운트업</span>
    </div>
    <span id="hostTag">호스트 없음</span>
  </div>

  <div id="clockzone">
    <div id="turnHint"></div>
    <div id="clock"><span id="cmain">00:00</span><span id="cdec">.0</span></div>
    <div id="counters">
      <div class="cnt a"><div class="lab" id="labA">A</div><div class="num" id="numA">0</div></div>
      <div class="cnt b"><div class="lab" id="labB">B</div><div class="num" id="numB">0</div></div>
    </div>
  </div>

  <!-- 호스트 제어 툴바 -->
  <div id="bar">
    <button id="startBtn">▶ 시작</button>
    <button id="resetBtn">↺ 리셋</button>
    <button id="modeBtn">⇄ 모드</button>
    <button id="setBtn">⚙ 설정</button>
    <button id="fsBtn">⛶ 전체화면</button>
  </div>
  <!-- 뷰어(비호스트) -->
  <div id="claimBar">
    <button id="claimBtn">이 기기에서 제어하기 (호스트 되기)</button>
    <div id="viewNote">호스트 화면과 실시간으로 동기화됩니다</div>
  </div>

  <!-- 모드 선택 -->
  <div class="ov" id="modeOv">
    <div class="card" style="max-width:400px">
      <div class="h"><span class="t">타이머 모드</span><button class="x" id="modeClose">닫기</button></div>
      <div class="body">
        <div class="seg" style="flex-direction:column">
          <button data-m="A" class="on">① 카운트업 (0부터 올라감)</button>
          <button data-m="B">② 카운트다운 (제한시간 → 0)</button>
          <button data-m="C">③ 반복 타이머 (A/B 번갈아 카운트)</button>
        </div>
      </div>
      <div class="hint">모드를 바꾸면 타이머가 리셋됩니다.</div>
      <div class="foot"><button class="btn-ghost" id="modeCancel">취소</button><button class="btn-primary" id="modeApply">적용</button></div>
    </div>
  </div>

  <!-- 설정 -->
  <div class="ov" id="setOv">
    <div class="card">
      <div class="h"><span class="t">설정</span><button class="x" id="setClose">닫기</button></div>
      <div class="body">
        <div class="row"><label>제목(선택)</label><input type="text" id="titleInput" placeholder="예: 6Q 기둥 넘기기"></div>
        <div id="limitRow" class="row"><label>제한/주기(초)</label><input type="number" id="limitInput" min="1" step="1" value="60"></div>
        <div id="turnRow" class="row"><label>먼저 카운트</label>
          <div class="seg"><button id="turnA" class="on">A 먼저</button><button id="turnB">B 먼저</button></div>
        </div>
        <div class="row"><label>A 이름</label><input type="text" id="nameA" placeholder="A"></div>
        <div class="row"><label>B 이름</label><input type="text" id="nameB" placeholder="B"></div>
      </div>
      <div class="hint" id="setHint">카운트다운은 제한시간, 반복 타이머는 한 주기 시간입니다.</div>
      <div class="foot"><button class="btn-ghost" id="setCancel">취소</button><button class="btn-primary" id="setSave">저장</button></div>
    </div>
  </div>

<script>
(function(){
  const $=id=>document.getElementById(id);
  const firebaseConfig={apiKey:"AIzaSyBwdehL0HSoRiVRbeJWkPEXM4DYhh6P7T8",authDomain:"psa-rowing.firebaseapp.com",databaseURL:"https://psa-rowing-default-rtdb.firebaseio.com",projectId:"psa-rowing",storageBucket:"psa-rowing.firebasestorage.app",messagingSenderId:"650938948468",appId:"1:650938948468:web:91212c15aa98f9ef52ea21"};

  // ---- identity ----
  let myId=null;
  try{ myId=localStorage.getItem('synctimer_id'); }catch(e){}
  if(!myId){ myId='u'+Math.random().toString(36).slice(2,9); try{localStorage.setItem('synctimer_id',myId);}catch(e){} }

  // ---- default state ----
  const DEF={mode:'A',running:false,startEpoch:0,accMs:0,limitMs:60000,startTurn:0,title:'',nameA:'A',nameB:'B',hostId:'',hostName:'',updated:0};
  let state=Object.assign({},DEF);
  let serverOffset=0;
  let db=null, ref=null, connected=false;

  function now(){ return Date.now()+serverOffset; }
  function isHost(){ return state.hostId && state.hostId===myId; }

  // ---- firebase ----
  try{
    firebase.initializeApp(firebaseConfig);
    db=firebase.database();
    ref=db.ref('synctimer/state');
    db.ref('.info/serverTimeOffset').on('value',s=>{ serverOffset=s.val()||0; });
    db.ref('.info/connected').on('value',s=>{ connected=!!s.val(); paintConn(); });
    ref.on('value',s=>{ const v=s.val(); state=Object.assign({},DEF,v||{}); applyRoles(); paint(); });
  }catch(e){ $('conn').textContent='연결 실패'; }

  function push(patch){ if(!ref) return; const next=Object.assign({},state,patch,{updated:firebase.database.ServerValue.TIMESTAMP}); ref.set(next); }

  function paintConn(){ const c=$('conn'); if(connected){ c.className='conn ok'; c.textContent='● 연결됨'; } else { c.className='conn no'; c.textContent='○ 연결 끊김'; } }

  // ---- roles / UI toggling ----
  function applyRoles(){
    const host=isHost();
    $('bar').style.display = host ? 'flex' : 'none';
    $('claimBar').classList.toggle('on', !host);
    if(state.hostId){
      $('hostTag').innerHTML = host ? '제어 중: <b>나</b>' : ('호스트: '+esc(state.hostName||'다른 기기'));
      $('claimBtn').textContent = state.hostId===myId ? '' : '제어권 가져오기';
    } else {
      $('hostTag').textContent='호스트 없음';
      $('claimBtn').textContent='이 기기에서 제어하기 (호스트 되기)';
    }
  }

  // ---- time math ----
  function rawElapsed(){ return state.running ? (now()-state.startEpoch) : state.accMs; }
  function fmt(ms){
    ms=Math.max(0,ms);
    const t=Math.floor(ms/100), d=t%10;
    let sec=Math.floor(t/10);
    const h=Math.floor(sec/3600), m=Math.floor((sec%3600)/60), s=sec%60;
    const p=n=>String(n).padStart(2,'0');
    const main = h>0 ? (h+':'+p(m)+':'+p(s)) : (p(m)+':'+p(s));
    return {main, d:'.'+d};
  }

  // ---- render ----
  let lastLen=-1, lastCycle=-1, warnState=false;
  function paint(){
    // mode tag
    $('modeTag').textContent = (state.title?state.title+' · ':'') + (state.mode==='A'?'카운트업':state.mode==='B'?'카운트다운':'반복 타이머');
    const isC = state.mode==='C';
    $('counters').classList.toggle('on', isC);
    $('turnHint').classList.toggle('on', isC);
    $('labA').textContent=state.nameA||'A'; $('labB').textContent=state.nameB||'B';

    const el=rawElapsed();
    let disp, warn=false, cmain;
    if(state.mode==='A'){
      disp=fmt(el);
    } else if(state.mode==='B'){
      const rem=state.limitMs-el;
      disp=fmt(rem);
      if(rem<=0){ disp=fmt(0); warn=true; }
      else if(rem<=5000){ warn=true; }
    } else { // C
      const lim=Math.max(1000,state.limitMs);
      const cycles=Math.floor(el/lim);
      const remInCycle=lim-(el%lim);
      disp=fmt(remInCycle);
      if(remInCycle<=3000) warn=true;
      // counts
      const st=state.startTurn?1:0;
      let a=0,b=0;
      if(st===0){ a=Math.ceil(cycles/2); b=Math.floor(cycles/2); }
      else { a=Math.floor(cycles/2); b=Math.ceil(cycles/2); }
      $('numA').textContent=a; $('numB').textContent=b;
      // whose turn now (this cycle completion increments (st+cycles)%2)
      const cur=(st+cycles)%2;
      $('turnHint').textContent = state.running ? ('이번 주기 완료 → '+((cur===0)?(state.nameA||'A'):(state.nameB||'B'))+' +1') : '대기 중';
      // local beep on cycle boundary
      if(state.running && cycles!==lastCycle){ if(lastCycle!==-1) beep(880,.25); lastCycle=cycles; }
    }
    if(state.mode!=='C') lastCycle=-1;
    // beep for B at zero
    if(state.mode==='B'){ const rem=state.limitMs-el; if(state.running && rem<=0 && !warnState){ beep(660,.4);} }
    warnState=warn;

    cmain=disp.main;
    $('cmain').textContent=cmain; $('cdec').textContent=disp.d;
    $('clock').classList.toggle('warn', warn);
    if(cmain.length!==lastLen){ lastLen=cmain.length; fitClock(); }

    // start button label
    $('startBtn').textContent = state.running ? '⏸ 일시정지' : '▶ 시작';
    $('startBtn').classList.toggle('paused', state.running);
  }

  function fitClock(){
    const zone=$('clockzone'), clk=$('clock');
    clk.style.fontSize='100px';
    const w=clk.scrollWidth||1, h=clk.scrollHeight||1;
    const aw=(zone.clientWidth||window.innerWidth)*0.94, ah=(zone.clientHeight||1)*0.80;
    const scale=Math.min(aw/w, ah/h);
    clk.style.fontSize=Math.max(24,Math.floor(100*scale))+'px';
  }

  // ---- audio ----
  let ac=null;
  function beep(freq,dur){ try{ ac=ac||new (window.AudioContext||window.webkitAudioContext)(); const o=ac.createOscillator(),g=ac.createGain(); o.frequency.value=freq; o.connect(g); g.connect(ac.destination); g.gain.setValueAtTime(.001,ac.currentTime); g.gain.exponentialRampToValueAtTime(.4,ac.currentTime+.02); g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+dur); o.start(); o.stop(ac.currentTime+dur+.02);}catch(e){} }

  // ---- host controls ----
  function toggleStart(){
    if(!isHost()) return;
    if(state.running){ push({running:false, accMs:(now()-state.startEpoch)}); }
    else { push({running:true, startEpoch:(now()-state.accMs)}); }
    try{ if(ac&&ac.state==='suspended') ac.resume(); }catch(e){}
  }
  function reset(){
    if(!isHost()) return;
    if(!confirm('타이머를 리셋할까요? (모든 화면 초기화)')) return;
    lastCycle=-1;
    push({running:false, startEpoch:0, accMs:0});
  }
  function fs(){ if(!document.fullscreenElement){ (document.documentElement.requestFullscreen||document.documentElement.webkitRequestFullscreen).call(document.documentElement); } else { (document.exitFullscreen||document.webkitExitFullscreen).call(document); } }

  // claim / release host
  $('claimBtn').addEventListener('click',()=>{
    if(state.hostId && state.hostId!==myId){ if(!confirm('현재 다른 기기가 제어 중입니다. 제어권을 가져올까요?')) return; }
    let nm=''; try{ nm=localStorage.getItem('synctimer_name')||''; }catch(e){}
    if(!nm){ nm=prompt('내 이름/기기명 (표시용)','호스트')||'호스트'; try{localStorage.setItem('synctimer_name',nm);}catch(e){} }
    push({hostId:myId, hostName:nm});
    try{ ac=ac||new (window.AudioContext||window.webkitAudioContext)(); ac.resume&&ac.resume(); }catch(e){}
  });

  // buttons
  $('startBtn').addEventListener('click',toggleStart);
  $('resetBtn').addEventListener('click',reset);
  $('fsBtn').addEventListener('click',fs);
  $('modeBtn').addEventListener('click',()=>{ if(!isHost())return; $('modeOv').querySelectorAll('.seg button').forEach(b=>b.classList.toggle('on',b.dataset.m===state.mode)); $('modeOv').classList.add('on'); });
  $('setBtn').addEventListener('click',openSet);

  // mode overlay
  let pickMode=state.mode;
  $('modeOv').querySelectorAll('.seg button').forEach(b=>b.addEventListener('click',()=>{ pickMode=b.dataset.m; $('modeOv').querySelectorAll('.seg button').forEach(x=>x.classList.toggle('on',x===b)); }));
  $('modeClose').addEventListener('click',()=>$('modeOv').classList.remove('on'));
  $('modeCancel').addEventListener('click',()=>$('modeOv').classList.remove('on'));
  $('modeApply').addEventListener('click',()=>{ if(!isHost())return; lastCycle=-1; push({mode:pickMode,running:false,startEpoch:0,accMs:0}); $('modeOv').classList.remove('on'); });

  // settings overlay
  let pickTurn=0;
  function openSet(){
    if(!isHost())return;
    $('titleInput').value=state.title||'';
    $('limitInput').value=Math.round((state.limitMs||60000)/1000);
    $('nameA').value=state.nameA||''; $('nameB').value=state.nameB||'';
    pickTurn=state.startTurn?1:0;
    $('turnA').classList.toggle('on',pickTurn===0); $('turnB').classList.toggle('on',pickTurn===1);
    const showLimit=(state.mode!=='A'); const showTurn=(state.mode==='C');
    $('limitRow').style.display=showLimit?'flex':'none';
    $('turnRow').style.display=showTurn?'flex':'none';
    $('setOv').classList.add('on');
  }
  $('turnA').addEventListener('click',()=>{pickTurn=0;$('turnA').classList.add('on');$('turnB').classList.remove('on');});
  $('turnB').addEventListener('click',()=>{pickTurn=1;$('turnB').classList.add('on');$('turnA').classList.remove('on');});
  $('setClose').addEventListener('click',()=>$('setOv').classList.remove('on'));
  $('setCancel').addEventListener('click',()=>$('setOv').classList.remove('on'));
  $('setSave').addEventListener('click',()=>{
    if(!isHost())return;
    const lim=Math.max(1,Number($('limitInput').value)||60)*1000;
    push({title:$('titleInput').value.trim(), limitMs:lim, startTurn:pickTurn, nameA:($('nameA').value.trim()||'A'), nameB:($('nameB').value.trim()||'B')});
    $('setOv').classList.remove('on');
  });

  const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

  // keyboard (host)
  document.addEventListener('keydown',e=>{ if(e.target.tagName==='INPUT')return; if(!isHost())return; if(e.code==='Space'){e.preventDefault();toggleStart();} else if(e.key==='f'||e.key==='F'){fs();} });

  // render loop
  setInterval(paint,50);
  window.addEventListener('resize',fitClock);
  window.addEventListener('load',fitClock);
  document.addEventListener('fullscreenchange',()=>setTimeout(fitClock,80));
  paint(); fitClock();
})();
</script>
</body>
</html>
